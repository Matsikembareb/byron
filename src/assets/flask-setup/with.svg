<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="fs-with-t">
  <title id="fs-with-t">A happy developer with both arms raised at a laptop with a Flask-Setup sticker, surrounded by green checkmarks</title>
  <circle cx="240" cy="190" r="150" fill="var(--surface, #f3f4f6)"/>
  <rect x="40" y="272" width="400" height="9" rx="4.5" fill="var(--border, #e5e7eb)"/>

  <!-- Sparkles -->
  <g fill="#14b8a6">
    <path d="M108 104l2.6 7.4 7.4 2.6-7.4 2.6-2.6 7.4-2.6-7.4-7.4-2.6 7.4-2.6z"/>
    <path d="M378 104l2 5.6 5.6 2-5.6 2-2 5.6-2-5.6-5.6-2 5.6-2z"/>
    <path d="M240 72l2.2 6.3 6.3 2.2-6.3 2.2-2.2 6.3-2.2-6.3-6.3-2.2 6.3-2.2z"/>
  </g>

  <!-- Person -->
  <rect x="230" y="180" width="20" height="30" rx="6" fill="#8a5a3c"/>
  <path d="M180 274V234c0-18 14-28 32-28h56c18 0 32 10 32 28v40z" fill="#1e5eff"/>
  <path d="M227 206l13 14 13-14" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms raised in celebration -->
  <path d="M199 216q-38-18-48-62-5-26-12-58" fill="none" stroke="#1e5eff" stroke-width="20" stroke-linecap="round"/>
  <path d="M281 216q38-18 48-62 5-26 12-58" fill="none" stroke="#1e5eff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="138" cy="92" r="11" fill="#8a5a3c"/>
  <circle cx="342" cy="92" r="11" fill="#8a5a3c"/>
  <circle cx="208" cy="156" r="7" fill="#7a4c31"/>
  <circle cx="272" cy="156" r="7" fill="#7a4c31"/>
  <ellipse cx="240" cy="152" rx="32" ry="36" fill="#8a5a3c"/>
  <path d="M208 147c-3-29 14-40 32-40 20 0 35 11 32 40-6-14-18-21-32-21s-26 7-32 21z" fill="#1f2937"/>
  <!-- Face: happy closed eyes, big smile, rosy cheeks -->
  <path d="M224 154q6-7 12 0M244 154q6-7 12 0" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M226 166q14 18 28 0z" fill="#1f2937" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <path d="M230 168q10 4 20 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="221" cy="165" r="5" fill="#f472b6" fill-opacity=".35"/>
  <circle cx="259" cy="165" r="5" fill="#f472b6" fill-opacity=".35"/>

  <!-- Laptop, seen from behind, with a Flask-Setup sticker -->
  <rect x="178" y="214" width="124" height="60" rx="6" fill="#cbd5e1"/>
  <rect x="166" y="270" width="148" height="6" rx="3" fill="#94a3b8"/>
  <svg x="226" y="230" width="28" height="28" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#0f766e"/>
    <path d="M24 11.5h16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 12v12.2L15.6 45.4A4.6 4.6 0 0 0 19.6 52.3h24.8a4.6 4.6 0 0 0 4-6.9L37 24.2V12" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="20.2" y="42.2" width="23.6" height="5.2" rx="1.6" fill="#fff"/>
    <rect x="23.4" y="35.6" width="17.2" height="5.2" rx="1.6" fill="#fff" fill-opacity=".85"/>
    <rect x="26.6" y="29" width="10.8" height="5.2" rx="1.6" fill="#fff" fill-opacity=".7"/>
  </svg>

  <!-- One mug, still warm -->
  <g stroke="#94a3b8" stroke-width="2">
    <rect x="96" y="248" width="18" height="24" rx="3" fill="#f8fafc"/>
    <path d="M114 254h4a4 4 0 0 1 0 9h-4" fill="none"/>
  </g>
  <path d="M101 242q-3-5 0-9M108 242q-3-5 0-9" fill="none" stroke="var(--muted, #9ca3af)" stroke-width="2" stroke-linecap="round"/>

  <!-- Success toasts -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <g transform="translate(20 30)">
      <rect width="124" height="30" rx="6" fill="#fff" stroke="#99f6e4"/>
      <rect width="4" height="30" rx="2" fill="#0f766e"/>
      <text x="14" y="19" fill="#115e59">✓ create_app()</text>
    </g>
    <g transform="translate(314 30)">
      <rect width="148" height="30" rx="6" fill="#fff" stroke="#99f6e4"/>
      <rect width="4" height="30" rx="2" fill="#0f766e"/>
      <text x="14" y="19" fill="#115e59">✓ flask db upgrade</text>
    </g>
    <g transform="translate(18 206)">
      <rect width="130" height="30" rx="6" fill="#fff" stroke="#99f6e4"/>
      <rect width="4" height="30" rx="2" fill="#0f766e"/>
      <text x="14" y="19" fill="#115e59">✓ tests passing</text>
    </g>
    <g transform="translate(316 206)">
      <rect width="156" height="30" rx="6" fill="#fff" stroke="#99f6e4"/>
      <rect width="4" height="30" rx="2" fill="#0f766e"/>
      <text x="14" y="19" fill="#115e59">✓ docker compose up</text>
    </g>
  </g>
</svg>
