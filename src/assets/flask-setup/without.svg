<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="fs-without-t">
  <title id="fs-without-t">A frustrated developer gripping their head at a laptop, surrounded by Flask error messages and empty coffee mugs</title>
  <circle cx="240" cy="190" r="150" fill="var(--surface, #f3f4f6)"/>
  <rect x="40" y="272" width="400" height="9" rx="4.5" fill="var(--border, #e5e7eb)"/>

  <!-- Person -->
  <rect x="230" y="180" width="20" height="30" rx="6" fill="#8a5a3c"/>
  <path d="M180 274V234c0-18 14-28 32-28h56c18 0 32 10 32 28v40z" fill="#1e5eff"/>
  <path d="M227 206l13 14 13-14" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="156" r="7" fill="#7a4c31"/>
  <circle cx="272" cy="156" r="7" fill="#7a4c31"/>
  <ellipse cx="240" cy="152" rx="32" ry="36" fill="#8a5a3c"/>
  <path d="M208 147c-3-29 14-40 32-40 20 0 35 11 32 40-6-14-18-21-32-21s-26 7-32 21z" fill="#1f2937"/>
  <!-- Face: knitted brows, worried eyes, wobbly mouth -->
  <path d="M223 140l12 5M257 140l-12 5" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <circle cx="231" cy="154" r="2.8" fill="#1f2937"/>
  <circle cx="249" cy="154" r="2.8" fill="#1f2937"/>
  <path d="M227 173q4.3-5 8.7 0t8.7 0 8.6 0" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Arms up, hands gripping the head -->
  <path d="M199 216q-50-14-40-48 8-22 46-28" fill="none" stroke="#1e5eff" stroke-width="20" stroke-linecap="round"/>
  <path d="M281 216q50-14 40-48-8-22-46-28" fill="none" stroke="#1e5eff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="207" cy="140" r="11" fill="#8a5a3c"/>
  <circle cx="273" cy="140" r="11" fill="#8a5a3c"/>
  <!-- Sweat drop and a tangle of thoughts -->
  <path d="M290 114c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z" fill="#7dd3fc"/>
  <path d="M212 94c10-14 22 4 30-8s20 10 28-4c6 12-14 16-22 10s-24 6-30-2 8-14 18-6" fill="none" stroke="var(--muted, #6b7280)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop, seen from behind -->
  <rect x="178" y="214" width="124" height="60" rx="6" fill="#cbd5e1"/>
  <rect x="166" y="270" width="148" height="6" rx="3" fill="#94a3b8"/>

  <!-- Empty coffee mugs -->
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="2">
    <rect x="66" y="248" width="18" height="24" rx="3"/><path d="M84 254h4a4 4 0 0 1 0 9h-4" fill="none"/>
    <rect x="94" y="248" width="18" height="24" rx="3"/><path d="M112 254h4a4 4 0 0 1 0 9h-4" fill="none"/>
    <rect x="122" y="248" width="18" height="24" rx="3"/><path d="M140 254h4a4 4 0 0 1 0 9h-4" fill="none"/>
  </g>

  <!-- Error toasts -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <g transform="translate(18 28)">
      <rect width="216" height="30" rx="6" fill="#fff" stroke="#fecaca"/>
      <rect width="4" height="30" rx="2" fill="#ef4444"/>
      <text x="14" y="19" fill="#991b1b">ImportError: circular import</text>
    </g>
    <g transform="translate(286 46)">
      <rect width="168" height="30" rx="6" fill="#fff" stroke="#fecaca"/>
      <rect width="4" height="30" rx="2" fill="#ef4444"/>
      <text x="14" y="19" fill="#991b1b">KeyError: 'SECRET_KEY'</text>
    </g>
    <g transform="translate(322 214)">
      <rect width="150" height="30" rx="6" fill="#fff" stroke="#fecaca"/>
      <rect width="4" height="30" rx="2" fill="#ef4444"/>
      <text x="14" y="19" fill="#991b1b">no such table: user</text>
    </g>
  </g>
</svg>
