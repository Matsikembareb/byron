<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Flask-Setup logo</title>
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <!-- Flask outline: lip, neck, then the conical body -->
  <path d="M24 11.5h16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 12v12.2L15.6 45.4A4.6 4.6 0 0 0 19.6 52.3h24.8a4.6 4.6 0 0 0 4-6.9L37 24.2V12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- The "setup": three stacked blocks filling the flask, ready to build on -->
  <rect x="20.2" y="42.2" width="23.6" height="5.2" rx="1.6" fill="#fff"/>
  <rect x="23.4" y="35.6" width="17.2" height="5.2" rx="1.6" fill="#fff" fill-opacity=".85"/>
  <rect x="26.6" y="29" width="10.8" height="5.2" rx="1.6" fill="#fff" fill-opacity=".7"/>
  <!-- Bubbles rising out of the neck -->
  <circle cx="33.6" cy="19.5" r="1.6" fill="#5eead4"/>
  <circle cx="30.5" cy="16" r="1.2" fill="#5eead4"/>
</svg>
