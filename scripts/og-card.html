<!doctype html>
<!-- Source of public/og.jpg (1200x630 social-share card). Edit, then run: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif; font-weight: 300; color: #fff;
    background: #1d1e21;
    display: grid; grid-template-columns: 1fr 340px; gap: 64px; align-items: center;
    padding: 64px 80px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand svg { width: 30px; height: 30px; }
  .dot { color: #5487ff; }
  .eyebrow { margin-top: 64px; font-size: 17px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; color: #a9abb0; }
  h1 { margin-top: 14px; font-size: 76px; line-height: 1.05; font-weight: 500; letter-spacing: -.015em; }
  .line { margin-top: 26px; font-size: 30px; line-height: 1.35; color: #e6e7ea; max-width: 640px; }
  .line em { font-style: normal; color: #5487ff; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 7px; }
  .url { margin-top: 40px; font-size: 22px; font-weight: 400; color: #5487ff; }
  .photo { width: 340px; height: 437px; border-radius: 6px; overflow: hidden; background: #25262a; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
  <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
  <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>
      <span>byron<span class="dot">.</span></span>
    </div>
    <p class="eyebrow">Python full-stack developer · Harare</p>
    <h1>Byron Matsikembare</h1>
    <p class="line">Websites, custom software and web apps, built with <em>Flask and React</em>.</p>
    <p class="url">byronmatsikembare.com</p>
  </div>
  <div class="photo"><img src="../public/images/byron-matsikembare-python-developer.webp" alt=""></div>
</body>
</html>
